server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unknown path falls back to index.html so
    # React Router's client-side routes (e.g. /incident, /chaos-lab) work
    # on a hard refresh, not just client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend container -- this is what lets the built
    # frontend call the relative "/api" path in every environment (dev via
    # Vite's proxy, production via this nginx block) without ever baking a
    # backend origin into the JS bundle.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
