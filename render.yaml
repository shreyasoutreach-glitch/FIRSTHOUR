databases:
  - name: first-hour-db
    databaseName: firsthour
    user: firsthour

services:
  - type: web
    name: first-hour-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: first-hour-db
          property: connectionString
      - key: DEMO_MODE
        value: true
      - key: DEMO_BOOTSTRAP_ON_START
        value: false
      - key: SEED
        value: 42
      - key: CORS_ORIGINS
        value: "https://firsthour-ui-n4cc.onrender.com"
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_ACCOUNT_NUMBER
        sync: false
      - key: RAZORPAY_MERCHANT_ID
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_MODE
        value: test
