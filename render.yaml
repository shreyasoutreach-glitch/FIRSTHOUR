databases:
  - name: first-hour-db
    databaseName: firsthour
    user: firsthour

services:
  - type: web
    name: first-hour-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: first-hour-db
          property: connectionString
      - key: DEMO_MODE
        value: false
      - key: SEED
        value: 42
      - key: AUTH_PROVIDER_DOMAIN
        sync: false
      - key: AUTH_PROVIDER_AUDIENCE
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_MODE
        value: test
