services:
  - type: web
    name: first-hour-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./first_hour.db  # Use Postgres in real production
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_MODE
        value: test
      - key: DEMO_MODE
        value: false
      - key: SEED
        value: 42
      - key: CORS_ORIGINS
        value: "https://first-hour-app.vercel.app,http://localhost:2090"
